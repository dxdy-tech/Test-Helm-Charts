## ---------------------------------------------------------------------------
## values-local.yaml — Local environment overrides
## Usage: helm install dad-farmer-registry . -f values.yaml -f values-local.yaml
## ---------------------------------------------------------------------------

## ---------------------------------------------------------------------------
## Social Registry (Odoo 17 / OpenG2P)
## ---------------------------------------------------------------------------
socialRegistry:
  enabled: true
  replicaCount: 1

  ## -- Custom Odoo image containing OpenG2P addons.
  ## The operator is responsible for building an image that includes all
  ## modules listed under socialRegistry.odoo.modules.
  image:
    repository: vsoneworld/openg2pdad
    tag: 0.0.13
    pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: vsow-dockerhub

  ## -- Ingress (Kubernetes-native, not OpenShift Route)
  ingress:
    enabled: true
    className: nginx
    hostname: social-registry.local
    tls:
      enabled: true
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"

  ## -- External PostgreSQL
  externalPostgresql:
    host: pg-postgresql.farmer-registry.svc.cluster.local
    port: 5432
    database: social_registry_local
    username: social_registry_local
    existingSecret: openg2p-social-registry-db-local
    sslmode: disable

  ## -- External Keycloak
  externalKeycloak:
    issuerUrl: https://keycloak-qa.apps.sovecloud.akaza.lk/auth/realms/openg2p-local
    baseUrl: https://keycloak-qa.apps.sovecloud.akaza.lk/auth
    realm: openg2p-local
    clientId: openg2p-social-registry-local
    existingSecret: openg2p-social-registry-keycloak-local
    secretKeys:
      clientSecret: client-secret

  ## -- External MinIO / S3
  externalMinio:
    endpoint: 172.30.238.56:9000
    bucket: social-registry
    secure: true
    existingSecret: openg2p-social-registry-minio-qa
    secretKeys:
      accessKey: access-key
      secretKey: secret-key

  ## -- ODK Central integration (consumed by g2p_odk_importer / g2p_odk_user_mapping)
  odkIntegration:
    centralUrl: http://odk.local

  ## -- Odoo runtime configuration
  odoo:
    ## Odoo admin email (used by Bitnami entrypoint for ODOO_EMAIL)
    email: devops@global.vsoneworld.com

    ## Existing secret holding the Odoo master admin password
    adminPasswordExistingSecret: openg2p-social-registry-admin-qa
    adminPasswordSecretKey: password

    ## Number of Odoo worker processes
    workers: 6

    ## Maximum cron thread count
    maxCronThreads: 2

    ## Proxy mode (set True when behind a reverse proxy / ingress)
    proxyMode: true

    ## Skip module update on restarts (except first run when persistence is empty)
    skipModulesUpdate: true

    ## Modules to expose
    modules:
      - g2p_registry_base
      - g2p_encryption
      - g2p_documents
      - g2p_auth_oidc
      - g2p_change_log
      - g2p_superset_dashboard
      - g2p_social_registry_theme
      - g2p_registry_individual
      - g2p_registry_group
      - g2p_agent_portal_base
      - g2p_odk_importer
      - g2p_mts
      - g2p_portal_auth
      - g2p_document_field
      - g2p_encryption_keymanager
      - g2p_encryption_rest_api
      - g2p_registry_rest_api
      - g2p_leaflet_map
      - g2p_registry_membership
      - g2p_registry_documents
      - g2p_registry_document_encryption
      - g2p_registry_encryption
      - g2p_auth_id_oidc
      - g2p_bank
      - g2p_document_encryption
      - g2p_enumerator
      - g2p_openid_vci
      - g2p_registry_addl_info
      - g2p_registry_g2p_connect_rest_api
      - g2p_registry_id_deduplication
      - g2p_social_registry
      - g2p_farmer
      - g2p_rest_api

  ## -- Enable verbose Odoo/Bitnami bootstrap logging
  extraEnv:
    - name: BITNAMI_DEBUG
      value: "true"

  ## -- Resource requests and limits
  resources:
    requests:
      cpu: 2
      memory: 4Gi
    limits:
      cpu: 2
      memory: 8Gi

  ## -- Persistence
  persistence:
    enabled: true
    storageClass: standard
    size: 10Gi

  ## -- Horizontal Pod Autoscaler
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: ''

  ## -- Pod Disruption Budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  ## -- NetworkPolicy
  networkPolicy:
    enabled: true

  ## -- Schedule on worker nodes only
  # affinity:
  #   nodeAffinity:
  #     requiredDuringSchedulingIgnoredDuringExecution:
  #       nodeSelectorTerms:
  #         - matchExpressions:
  #             - key: node-role.kubernetes.io/control-plane
  #               operator: DoesNotExist
