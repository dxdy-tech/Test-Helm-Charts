## ---------------------------------------------------------------------------
## Global settings
## ---------------------------------------------------------------------------
global:
  nameOverride: ""
  fullnameOverride: ""

## ---------------------------------------------------------------------------
## Social Registry (Odoo 17 / OpenG2P)
## ---------------------------------------------------------------------------
socialRegistry:
  enabled: true

  replicaCount: 1

  ## -- Custom Odoo image containing OpenG2P addons.
  ## The operator is responsible for building an image that includes all
  ## modules listed under socialRegistry.odoo.modules.
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  # - name: my-registry-secret

  ## -- ServiceAccount
  serviceAccount:
    create: true
    name: ""
    annotations: {}

  ## -- Pod-level settings
  podAnnotations: {}
  podLabels: {}

  ## -- Security contexts
  podSecurityContext:
    fsGroup: 1000
  ## The OpenG2P Odoo image starts as root to perform first-run setup and then
  ## drops privileges internally. Do not force a non-root UID here.
  containerSecurityContext: {}

  ## -- Kubernetes Service
  service:
    type: ClusterIP
    port: 80
    targetPort: 8069

  ## -- Ingress (Kubernetes-native, not OpenShift Route)
  ingress:
    enabled: true
    className: ""
    hostname: ""
    tls:
      enabled: true
      ## Provide an existing TLS secret. When empty, a self-signed
      ## certificate is auto-generated by the chart.
      existingSecretName: ""
    annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod

  ## -- Persistence (NFS-backed or storageClass-managed)
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteMany
    size: 10Gi
    ## Mount path expected by the Bitnami/OpenG2P image for persisted app data.
    mountPath: /bitnami/odoo

  ## -- External PostgreSQL (no in-cluster PG for Social Registry)
  externalPostgresql:
    host: ""
    port: 5432
    database: "socialregistrydb"
    username: "sruser"
    existingSecret: ""
    secretKeys:
      password: password
    sslmode: require

  ## -- External Keycloak
  externalKeycloak:
    issuerUrl: ""
    baseUrl: ""
    realm: "master"
    clientId: ""
    existingSecret: ""
    secretKeys:
      clientSecret: client-secret

  ## -- External MinIO / S3
  externalMinio:
    endpoint: ""
    bucket: "social-registry"
    region: ""
    secure: true
    existingSecret: ""
    secretKeys:
      accessKey: access-key
      secretKey: secret-key

  ## -- Istio VirtualService (when using Istio service mesh instead of nginx ingress)
  istio:
    enabled: false
    gateway: "istio-system/main-gateway"
    host: ""

  ## -- ODK Central integration (consumed by g2p_odk_importer / g2p_odk_user_mapping)
  odkIntegration:
    enabled: true
    centralUrl: ""
    existingSecret: ""
    secretKeys:
      apiToken: api-token

  ## -- Odoo runtime configuration
  odoo:
    ## Proxy mode (set True when behind a reverse proxy / ingress)
    proxyMode: true
    ## Whether to list databases on the login screen
    listDb: false
    ## Skip first-run bootstrap when reusing an existing Odoo database.
    skipBootstrap: false
    ## Skip module update during startup when the database is already managed.
    skipModulesUpdate: false
    ## Number of Odoo worker processes
    workers: 4
    ## Maximum cron thread count
    maxCronThreads: 2
    ## Database filter regex
    dbfilter: ".*"
    ## Server-wide modules loaded at startup
    serverWideModules: "web"
    ## Email used for the Odoo admin account
    adminEmail: "admin@example.com"
    ## Existing secret that contains the Odoo admin password
    adminPasswordExistingSecret: ""
    adminPasswordSecretKey: "admin-password"


    ## -- Configurable module list
    ## These names are passed as-is into runtime configuration.  Helm does
    ## NOT validate whether the modules actually exist in the image.
    ## The custom image is solely responsible for containing these addons.
    modules:
      - g2p_registry_base
      - g2p_encryption
      - g2p_documents
      - g2p_auth_oidc
      - g2p_change_log
      - g2p_registry
      - g2p_superset_dashboard
      - g2p_social_registry_theme
      - g2p_registry_individual
      - g2p_registry_group
      - g2p_agent_portal_base
      - g2p_odk_importer
      - g2p_mts
      - g2p_portal_auth
      - g2p_document_field
      - g2p_encryption_keymanager
      - g2p_encryption_rest_api
      - g2p_registry_rest_api
      - g2p_leaflet_map
      - g2p_registry_membership
      - g2p_registry_documents
      - g2p_registry_document_encryption
      - g2p_registry_encryption
      - g2p_auth_id_oidc
      - g2p_bank
      - g2p_document_encryption
      - g2p_enumerator
      - g2p_openid_vci
      - g2p_registry_addl_info
      - g2p_registry_g2p_connect_rest_api
      - g2p_registry_id_deduplication
      - g2p_social_registry
      ## -- Future DAD custom modules (uncomment when image includes them)
      # - dad_farmer_registry
      # - dad_rest_api

    ## Extra CLI arguments passed to the odoo binary
    extraArgs: []

  ## -- Additional environment variables injected into the Odoo container
  extraEnv: []
  # - name: EXTRA_VAR
  #   value: "some-value"

  ## -- Extra volumes / volumeMounts
  extraVolumes: []
  extraVolumeMounts: []

  ## -- Resource requests and limits
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

  ## -- Horizontal Pod Autoscaler
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: ""

  ## -- Pod Disruption Budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
    # maxUnavailable: 1

  ## -- NetworkPolicy
  networkPolicy:
    enabled: true

  ## -- Node scheduling
  nodeSelector: {}
  tolerations: []
  affinity: {}

  ## -- Probes
  startupProbe:
    enabled: true
    httpGet:
      path: /web/health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1

  livenessProbe:
    enabled: true
    httpGet:
      path: /web/health
      port: http
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  readinessProbe:
    enabled: true
    httpGet:
      path: /web/health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
