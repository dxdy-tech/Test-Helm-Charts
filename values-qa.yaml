## ---------------------------------------------------------------------------
## values-qa.yaml — QA environment overrides
## Usage: helm install dad-farmer-registry . -f values.yaml -f values-qa.yaml
## ---------------------------------------------------------------------------

## ---------------------------------------------------------------------------
## Social Registry (Odoo 17 / OpenG2P)
## ---------------------------------------------------------------------------
socialRegistry:
  enabled: true
  replicaCount: 1

  ## -- Custom Odoo image containing OpenG2P addons.
  ## The operator is responsible for building an image that includes all
  ## modules listed under socialRegistry.odoo.modules.
  image:
    repository: openg2p/openg2p-social-registry-core
    tag: "1.5.7"
    pullPolicy: IfNotPresent

  ## -- Ingress (Kubernetes-native, not OpenShift Route)
  # ingress:
  #   enabled: true
  #   className: nginx
  #   hostname: farmer-registry-qa.agrariandept.gov.lk
  #   tls:
  #     enabled: true
  #     secretName: openg2p-social-registry-tls-qa
  #   annotations:
  #     cert-manager.io/cluster-issuer: letsencrypt-qa
  #     nginx.ingress.kubernetes.io/proxy-body-size: "100m"
  #     nginx.ingress.kubernetes.io/proxy-read-timeout: "300"

  ## -- External PostgreSQL (no in-cluster PG for Social Registry)
  externalPostgresql:
    host: 172.30.244.47
    port: 5432
    database: social_registry
    username: social_registry_user
    existingSecret: openg2p-social-registry-db-qa
    sslmode: require

  ## -- External Keycloak
  externalKeycloak:
    issuerUrl: https://keycloak-qa.apps.sovecloud.akaza.lk/realms/openg2p-qa
    baseUrl: https://keycloak-qa.apps.sovecloud.akaza.lk
    realm: openg2p-qa
    clientId: openg2p-social-registry-qa
    existingSecret: openg2p-social-registry-keycloak-qa

  ## -- External MinIO / S3
  externalMinio:
    endpoint: 172.30.238.56:9000
    bucket: social-registry
    secure: true
    existingSecret: openg2p-social-registry-minio-qa

  ## -- ODK Central integration (consumed by g2p_odk_importer / g2p_odk_user_mapping)
  odkIntegration:
    centralUrl: https://odk-qa.apps.sovecloud.akaza.lk

  ## -- Odoo runtime configuration
  odoo:
    ## Odoo admin email (used by Bitnami entrypoint for ODOO_EMAIL)
    email: "devops@global.vsoneworld.com"
    ## Existing secret holding the Odoo master admin password
    adminPasswordExistingSecret: openg2p-social-registry-admin-qa
    ## When false, module list is exposed as env var but NOT force-installed.
    autoInstallModules: true
    ## Number of Odoo worker processes
    workers: 6
    ## Maximum cron thread count
    maxCronThreads: 2
    ## Proxy mode (set True when behind a reverse proxy / ingress)
    proxyMode: true
    ## Modules to expose
    modules:
      - g2p_agent_portal_base
      - g2p_registry_individual
      - g2p_registry_group
      - g2p_registry_membership
      - g2p_registry_dashboard
      - g2p_registry_theme
      - g2p_odk_importer
      - g2p_registry_rest_api
      - g2p_registry_deduplication_deduplicator
      - g2p_registration_portal_base
      - g2p_odk_user_mapping

  ## -- Resource requests and limits
  resources:
    requests:
      cpu: 250m
      memory: 2Gi
    limits:
      cpu: 1
      memory: 8Gi

  ## -- Persistence
  persistence:
    enabled: true
    storageClass: nfs-client
    size: 10Gi

  ## -- Horizontal Pod Autoscaler
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 70

  ## -- Pod Disruption Budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  ## -- NetworkPolicy
  networkPolicy:
    enabled: true

  ## -- Schedule on worker nodes only
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

## ---------------------------------------------------------------------------
## ODK Central
## ---------------------------------------------------------------------------
odkCentral:
  enabled: true
  replicaCount: 1

  ## -- Images
  image:
    repository: openg2p/odk-central-backend
    tag: v2025.2.1
    pullPolicy: IfNotPresent

  frontend:
    image:
      repository: ghcr.io/getodk/central-nginx
      tag: v2025.2.1
      pullPolicy: IfNotPresent

  ## -- Ingress
  # ingress:
  #   enabled: true
  #   className: nginx
  #   hostname: odk-qa.agrariandept.gov.lk
  #   tls:
  #     enabled: true
  #     secretName: openg2p-odk-tls-qa
  #   annotations:
  #     cert-manager.io/cluster-issuer: letsencrypt-qa
  #     nginx.ingress.kubernetes.io/proxy-body-size: "100m"

  ## -- Admin account
  admin:
    email: Chamath.Ellawala@global.vsoneworld.com
    passwordExistingSecret: openg2p-social-registry-admin-qa

  ## -- Database configuration
  database:
    ## No internal PG — using external database
    internal:
      enabled: false
    external:
      host: 172.30.244.47
      port: 5432
      database: odk
      username: odk_user
      existingSecret: openg2p-odk-db-qa

  ## -- Persistence
  persistence:
    enabled: true
    storageClass: nfs-client
    size: 20Gi

  ## -- Resource requests and limits (backend)
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

  ## -- Horizontal Pod Autoscaler
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 70

  ## -- Pod Disruption Budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  ## -- NetworkPolicy
  networkPolicy:
    enabled: true

  ## -- Schedule on worker nodes only (RKE2 control-plane anti-affinity)
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
