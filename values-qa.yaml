## ---------------------------------------------------------------------------
## values-qa.yaml — QA environment overrides
## Usage: helm install dad-farmer-registry . -f values.yaml -f values-qa.yaml
## ---------------------------------------------------------------------------

## ---------------------------------------------------------------------------
## Social Registry (Odoo 17 / OpenG2P)
## ---------------------------------------------------------------------------
socialRegistry:
  enabled: true
  replicaCount: 1

  ## -- Custom Odoo image containing OpenG2P addons.
  ## The operator is responsible for building an image that includes all
  ## modules listed under socialRegistry.odoo.modules.
  image:
    repository: vsoneworld/openg2pdad
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: vsow-dockerhub

  ## -- Ingress (Kubernetes-native, not OpenShift Route)
  # ingress:
  #   enabled: true
  #   className: nginx
  #   hostname: farmer-registry-qa.agrariandept.gov.lk
  #   tls:
  #     enabled: true
  #     secretName: openg2p-social-registry-tls-qa
  #   annotations:
  #     cert-manager.io/cluster-issuer: letsencrypt-qa
  #     nginx.ingress.kubernetes.io/proxy-body-size: "100m"
  #     nginx.ingress.kubernetes.io/proxy-read-timeout: "300"

  ## -- External PostgreSQL (no in-cluster PG for Social Registry)
  externalPostgresql:
    host: 172.30.244.47
    port: 5432
    database: social_registry
    username: social_registry_user
    existingSecret: openg2p-social-registry-db-qa
    sslmode: require

  ## -- External Keycloak
  externalKeycloak:
    issuerUrl: https://keycloak-qa.apps.sovecloud.akaza.lk/realms/openg2p-qa
    baseUrl: https://keycloak-qa.apps.sovecloud.akaza.lk
    realm: openg2p-qa
    clientId: openg2p-social-registry-qa
    existingSecret: openg2p-social-registry-keycloak-qa
    secretKeys:
      clientSecret: client-secret

  ## -- External MinIO / S3
  externalMinio:
    endpoint: 172.30.238.56:9000
    bucket: social-registry
    secure: true
    existingSecret: openg2p-social-registry-minio-qa
    secretKeys:
      accessKey: access-key
      secretKey: secret-key

  ## -- ODK Central integration (consumed by g2p_odk_importer / g2p_odk_user_mapping)
  odkIntegration:
    centralUrl: https://odk-qa.apps.sovecloud.akaza.lk

  ## -- Odoo runtime configuration
  odoo:
    ## Odoo admin email (used by Bitnami entrypoint for ODOO_EMAIL)
    email: devops@global.vsoneworld.com
    ## Existing secret holding the Odoo master admin password
    adminPasswordExistingSecret: openg2p-social-registry-admin-qa
    adminPasswordSecretKey: password
    ## Number of Odoo worker processes
    workers: 6
    ## Maximum cron thread count
    maxCronThreads: 2
    ## Proxy mode (set True when behind a reverse proxy / ingress)
    proxyMode: true
    ## Modules to expose
    modules:
      - g2p_registry_base
      - g2p_encryption
      - g2p_documents
      - g2p_auth_oidc
      - g2p_change_log
      - g2p_registry
      - g2p_superset_dashboard
      - g2p_social_registry_theme
      - g2p_registry_individual
      - g2p_registry_group
      - g2p_agent_portal_base
      - g2p_odk_importer
      - g2p_mts
      - g2p_portal_auth
      - g2p_document_field
      - g2p_encryption_keymanager
      - g2p_encryption_rest_api
      - g2p_registry_rest_api
      - g2p_leaflet_map
      - g2p_registry_membership
      - g2p_registry_documents
      - g2p_registry_document_encryption
      - g2p_registry_encryption
      - g2p_auth_id_oidc
      - g2p_bank
      - g2p_document_encryption
      - g2p_enumerator
      - g2p_openid_vci
      - g2p_registry_addl_info
      - g2p_registry_g2p_connect_rest_api
      - g2p_registry_id_deduplication
      - g2p_social_registry

  ## -- Enable verbose Odoo/Bitnami bootstrap logging
  extraEnv:
    - name: BITNAMI_DEBUG
      value: "true"

  ## -- Resource requests and limits
  resources:
    requests:
      cpu: 2
      memory: 4Gi
    limits:
      cpu: 4
      memory: 8Gi

  ## -- Persistence
  persistence:
    enabled: true
    storageClass: nfs-client
    size: 10Gi

  startupProbe:
    enabled: true
    httpGet:
      path: /web/health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 120
    successThreshold: 1

  ## -- Horizontal Pod Autoscaler
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 70

  ## -- Pod Disruption Budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  ## -- NetworkPolicy
  networkPolicy:
    enabled: false

  ## -- Schedule on worker nodes only
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

## ---------------------------------------------------------------------------
## ODK Central
## ---------------------------------------------------------------------------
odkCentral:
  enabled: false
  replicaCount: 1

  ## -- Images
  image:
    repository: openg2p/odk-central-backend
    tag: v2025.2.1
    pullPolicy: IfNotPresent

  frontend:
    image:
      repository: ghcr.io/getodk/central-nginx
      tag: v2025.2.1
      pullPolicy: IfNotPresent

  ## -- Ingress
  # ingress:
  #   enabled: true
  #   className: nginx
  #   hostname: odk-qa.agrariandept.gov.lk
  #   tls:
  #     enabled: true
  #     secretName: openg2p-odk-tls-qa
  #   annotations:
  #     cert-manager.io/cluster-issuer: letsencrypt-qa
  #     nginx.ingress.kubernetes.io/proxy-body-size: "100m"

  ## -- Admin account
  admin:
    email: devops@global.vsoneworld.com
    passwordExistingSecret: openg2p-odk-admin-qa
    passwordSecretKey: password

  ## -- Enketo dependencies
  enketo:
    redis:
      enabled: true

  ## -- Database configuration
  database:
    ## No internal PG — using external database
    internal:
      enabled: false
    external:
      host: 172.30.244.47
      port: 5432
      database: odk
      username: odk_user
      existingSecret: openg2p-odk-db-qa

  ## -- Persistence
  persistence:
    enabled: true
    storageClass: nfs-client
    size: 20Gi

  ## -- Resource requests and limits (backend)
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

  ## -- Horizontal Pod Autoscaler
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 70

  ## -- Pod Disruption Budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  ## -- NetworkPolicy
  networkPolicy:
    enabled: false

  ## -- Schedule on worker nodes only (RKE2 control-plane anti-affinity)
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
