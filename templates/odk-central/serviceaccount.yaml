{{- if .Values.odkCentral.enabled }}
{{- if .Values.odkCentral.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "odk-central.serviceAccountName" . }}
  labels:
    {{- include "odk-central.labels" . | nindent 4 }}
  {{- with .Values.odkCentral.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
