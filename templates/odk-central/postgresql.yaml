{{- if and .Values.odkCentral.enabled .Values.odkCentral.database.internal.enabled }}
##
## Optional internal PostgreSQL for ODK Central.
## Only deployed when odkCentral.database.internal.enabled is true.
##
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "odk-central.postgresFullname" . }}
  labels:
    {{- include "odk-central.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
data:
  postgres-password: {{ randAlphaNum 24 | b64enc | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "odk-central.postgresFullname" . }}
  labels:
    {{- include "odk-central.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgresql
  selector:
    app.kubernetes.io/name: {{ include "farmer-registry.name" . }}-odk-postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "odk-central.postgresFullname" . }}
  labels:
    {{- include "odk-central.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ include "odk-central.postgresFullname" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "farmer-registry.name" . }}-odk-postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "farmer-registry.name" . }}-odk-postgresql
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: postgresql
    spec:
      serviceAccountName: {{ include "odk-central.serviceAccountName" . }}
      securityContext:
        fsGroup: 999
      containers:
        - name: postgresql
          image: "{{ .Values.odkCentral.database.internal.image.repository }}:{{ .Values.odkCentral.database.internal.image.tag }}"
          imagePullPolicy: {{ .Values.odkCentral.database.internal.image.pullPolicy }}
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: {{ .Values.odkCentral.database.external.database | default "odkdb" | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.odkCentral.database.external.username | default "odkuser" | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "odk-central.postgresFullname" . }}
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.odkCentral.database.external.username | default "odkuser" | quote }}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.odkCentral.database.external.username | default "odkuser" | quote }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.odkCentral.database.internal.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.odkCentral.database.internal.storage.storageClass }}
        storageClassName: {{ .Values.odkCentral.database.internal.storage.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.odkCentral.database.internal.storage.size | default "10Gi" }}
{{- end }}
