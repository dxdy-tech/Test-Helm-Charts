{{- if and .Values.odkCentral.enabled .Values.odkCentral.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "odk-central.fullname" . }}
  labels:
    {{- include "odk-central.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "odk-central.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    ## Allow from the ODK frontend
    - from:
        - podSelector:
            matchLabels:
              {{- include "odk-central.frontendSelectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8383
    ## Allow from Social Registry (ODK importer integration)
    - from:
        - podSelector:
            matchLabels:
              {{- include "social-registry.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8383
  egress:
    ## DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    ## Istio control plane (istiod)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15012
        - protocol: TCP
          port: 15010
    ## PostgreSQL
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 5432
    ## Intra-namespace (Enketo, Pyxform, etc.)
    - to:
        - podSelector: {}
---
## Frontend NetworkPolicy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "odk-central.frontendFullname" . }}
  labels:
    {{- include "odk-central.frontendLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "odk-central.frontendSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    ## Allow from ingress controller
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
  egress:
    ## DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    ## Istio control plane (istiod)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15012
        - protocol: TCP
          port: 15010
    ## To backend and enketo within namespace
    - to:
        - podSelector: {}
{{- end }}
