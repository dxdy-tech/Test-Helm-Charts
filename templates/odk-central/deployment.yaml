{{- if .Values.odkCentral.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "odk-central.backendFullname" . }}
  labels:
    {{- include "odk-central.labels" . | nindent 4 }}
spec:
  {{- if not .Values.odkCentral.autoscaling.enabled }}
  replicas: {{ .Values.odkCentral.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "odk-central.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/odk-central/configmap.yaml") . | sha256sum }}
        {{- with .Values.odkCentral.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "odk-central.selectorLabels" . | nindent 8 }}
        {{- with .Values.odkCentral.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "odk-central.serviceAccountName" . }}
      {{- with .Values.odkCentral.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.odkCentral.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.odkCentral.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.odkCentral.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.odkCentral.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: odk-backend
          image: "{{ .Values.odkCentral.image.repository }}:{{ .Values.odkCentral.image.tag }}"
          imagePullPolicy: {{ .Values.odkCentral.image.pullPolicy }}
          {{- with .Values.odkCentral.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["bash"]
          args: ["-c", "/usr/share/odk/start-odk.sh"]
          ports:
            - name: http
              containerPort: 8383
              protocol: TCP
          env:
            - name: DOMAIN
              value: {{ .Values.odkCentral.ingress.hostname | quote }}
            - name: SYSADMIN_EMAIL
              value: {{ .Values.odkCentral.admin.email | quote }}
            {{- if .Values.odkCentral.admin.passwordExistingSecret }}
            - name: SYSADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.odkCentral.admin.passwordExistingSecret }}
                  key: {{ .Values.odkCentral.admin.passwordSecretKey | default "password" }}
            {{- end }}
            - name: DB_HOST
              value: {{ include "odk-central.dbHost" . | quote }}
            - name: DB_PORT
              value: {{ include "odk-central.dbPort" . | quote }}
            - name: DB_NAME
              value: {{ include "odk-central.dbName" . | quote }}
            - name: DB_USER
              value: {{ include "odk-central.dbUser" . | quote }}
            - name: DB_SSL
              value: {{ ((.Values.odkCentral.database).external).ssl | default "null" | quote }}
            {{- if or (((.Values.odkCentral.database).internal).enabled) (((.Values.odkCentral.database).external).existingSecret) }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "odk-central.dbPasswordSecretName" . }}
                  key: {{ include "odk-central.dbPasswordSecretKey" . }}
            {{- end }}
            - name: ENKETO_HOST
              value: {{ include "odk-central.enketoFullname" . | quote }}
            - name: ENKETO_PORT
              value: "8005"
            - name: ENKETO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "odk-central.enketoSecretName" . }}
                  key: {{ (.Values.odkCentral.enketo).secretKey | default "enketo-api-key" }}
            - name: PYXFORM_HOST
              value: {{ include "odk-central.pyxformFullname" . | quote }}
            - name: PYXFORM_PORT
              value: "80"
            - name: EMAIL_FROM
              value: {{ (.Values.odkCentral.email).from | default (printf "no-reply@%s" .Values.odkCentral.ingress.hostname) | quote }}
            - name: EMAIL_HOST
              value: {{ (.Values.odkCentral.email).host | default "localhost" | quote }}
            - name: EMAIL_PORT
              value: {{ (.Values.odkCentral.email).port | default 25 | quote }}
            - name: EMAIL_SECURE
              value: {{ (.Values.odkCentral.email).secure | default false | quote }}
            - name: EMAIL_IGNORE_TLS
              value: {{ (.Values.odkCentral.email).ignoreTls | default true | quote }}
            {{- with .Values.odkCentral.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.odkCentral.startupProbe.enabled }}
          startupProbe:
            {{- omit .Values.odkCentral.startupProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.odkCentral.livenessProbe.enabled }}
          livenessProbe:
            {{- omit .Values.odkCentral.livenessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.odkCentral.readinessProbe.enabled }}
          readinessProbe:
            {{- omit .Values.odkCentral.readinessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- with .Values.odkCentral.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config-template
              mountPath: /usr/share/odk/config.json.template
              subPath: config.json.template
            - name: config-template
              mountPath: /usr/share/odk/start-odk.sh
              subPath: start-odk.sh
            {{- if (.Values.odkCentral.persistence).enabled }}
            - name: data
              mountPath: /data
            {{- end }}
            {{- with .Values.odkCentral.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config-template
          configMap:
            name: {{ include "odk-central.fullname" . }}-config
            defaultMode: 0755
        {{- if (.Values.odkCentral.persistence).enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "odk-central.pvcName" . }}
        {{- end }}
        {{- with .Values.odkCentral.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
## ODK Central Frontend (nginx)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "odk-central.frontendFullname" . }}
  labels:
    {{- include "odk-central.frontendLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.odkCentral.frontend.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "odk-central.frontendSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/odk-central/configmap.yaml") . | sha256sum }}
        {{- with .Values.odkCentral.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "odk-central.frontendSelectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "odk-central.serviceAccountName" . }}
      {{- with .Values.odkCentral.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.odkCentral.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.odkCentral.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.odkCentral.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: odk-frontend
          image: "{{ .Values.odkCentral.frontend.image.repository }}:{{ .Values.odkCentral.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.odkCentral.frontend.image.pullPolicy }}
          command: ["bash"]
          args: ["-c", "/usr/share/odk/nginx/setup-odk.sh"]
          ports:
            - name: http
              containerPort: {{ .Values.odkCentral.frontend.containerPort | default 80 }}
              protocol: TCP
          env:
            - name: BACKEND_URL
              value: {{ include "odk-central.backendFullname" . | quote }}
            - name: ENKETO_HOST
              value: {{ include "odk-central.enketoFullname" . | quote }}
            - name: ENKETO_PORT
              value: "8005"
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          {{- with .Values.odkCentral.frontend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: frontend-config
              mountPath: /usr/share/odk/nginx/odk.conf.template
              subPath: odk.conf.template
            - name: frontend-config
              mountPath: /usr/share/odk/nginx/setup-odk.sh
              subPath: setup-odk.sh
      volumes:
        - name: frontend-config
          configMap:
            name: {{ include "odk-central.frontendFullname" . }}-config
            defaultMode: 0755
{{- end }}
