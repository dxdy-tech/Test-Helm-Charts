{{- if .Values.odkCentral.enabled }}
## Backend service (internal, for frontend proxy)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "odk-central.backendFullname" . }}
  labels:
    {{- include "odk-central.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.odkCentral.service.port | default 80 }}
      targetPort: 8383
      protocol: TCP
      name: http
  selector:
    {{- include "odk-central.selectorLabels" . | nindent 4 }}
---
## Frontend service (ingress target)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "odk-central.frontendFullname" . }}
  labels:
    {{- include "odk-central.frontendLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: {{ .Values.odkCentral.frontend.containerPort | default 80 }}
      protocol: TCP
      name: http
  selector:
    {{- include "odk-central.frontendSelectorLabels" . | nindent 4 }}
{{- end }}
