{{- if and .Values.odkCentral.enabled .Values.odkCentral.enketo.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "odk-central.enketoFullname" . }}
  labels:
    {{- include "odk-central.labels" . | nindent 4 }}
    app.kubernetes.io/component: enketo
spec:
  replicas: {{ .Values.odkCentral.enketo.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "farmer-registry.name" . }}-odk-enketo
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "farmer-registry.name" . }}-odk-enketo
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: enketo
    spec:
      serviceAccountName: {{ include "odk-central.serviceAccountName" . }}
      {{- with .Values.odkCentral.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.odkCentral.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.odkCentral.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.odkCentral.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: enketo
          image: "{{ (.Values.odkCentral.enketo.image).repository | default "ghcr.io/getodk/central-enketo" }}:{{ (.Values.odkCentral.enketo.image).tag | default "v2025.2.1" }}"
          imagePullPolicy: {{ (.Values.odkCentral.enketo.image).pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 8005
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.odkCentral.enketo.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "odk-central.enketoFullname" . }}
  labels:
    {{- include "odk-central.labels" . | nindent 4 }}
    app.kubernetes.io/component: enketo
spec:
  type: ClusterIP
  ports:
    - port: 8005
      targetPort: 8005
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "farmer-registry.name" . }}-odk-enketo
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
{{- if and .Values.odkCentral.enabled .Values.odkCentral.enketo.enabled (not .Values.odkCentral.enketo.existingSecret) }}
---
## Auto-generated Enketo API key secret (only if no existing secret provided)
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "odk-central.enketoFullname" . }}
  labels:
    {{- include "odk-central.labels" . | nindent 4 }}
    app.kubernetes.io/component: enketo
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
data:
  {{- if .Values.odkCentral.enketo.apiKey }}
  {{ .Values.odkCentral.enketo.secretKey | default "enketo-api-key" }}: {{ .Values.odkCentral.enketo.apiKey | b64enc | quote }}
  {{- else }}
  {{ .Values.odkCentral.enketo.secretKey | default "enketo-api-key" }}: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
