{{- if and .Values.odkCentral.enabled .Values.odkCentral.pyxform.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "odk-central.pyxformFullname" . }}
  labels:
    {{- include "odk-central.labels" . | nindent 4 }}
    app.kubernetes.io/component: pyxform
spec:
  replicas: {{ .Values.odkCentral.pyxform.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "farmer-registry.name" . }}-odk-pyxform
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "farmer-registry.name" . }}-odk-pyxform
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: pyxform
    spec:
      serviceAccountName: {{ include "odk-central.serviceAccountName" . }}
      {{- with .Values.odkCentral.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.odkCentral.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.odkCentral.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.odkCentral.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: pyxform
          image: "{{ (.Values.odkCentral.pyxform.image).repository | default "ghcr.io/getodk/central-pyxform" }}:{{ (.Values.odkCentral.pyxform.image).tag | default "v2025.2.1" }}"
          imagePullPolicy: {{ (.Values.odkCentral.pyxform.image).pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.odkCentral.pyxform.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "odk-central.pyxformFullname" . }}
  labels:
    {{- include "odk-central.labels" . | nindent 4 }}
    app.kubernetes.io/component: pyxform
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "farmer-registry.name" . }}-odk-pyxform
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
