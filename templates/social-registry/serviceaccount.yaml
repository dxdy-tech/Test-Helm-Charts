{{- if .Values.socialRegistry.enabled }}
{{- if .Values.socialRegistry.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "social-registry.serviceAccountName" . }}
  labels:
    {{- include "social-registry.labels" . | nindent 4 }}
  {{- with .Values.socialRegistry.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
