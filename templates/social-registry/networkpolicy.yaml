{{- if and .Values.socialRegistry.enabled .Values.socialRegistry.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "social-registry.fullname" . }}
  labels:
    {{- include "social-registry.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "social-registry.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    ## Allow traffic from the ingress controller
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8069
    ## Allow intra-namespace traffic (e.g. from ODK Central)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8069
  egress:
    ## Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    ## Istio control plane (istiod)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15012
        - protocol: TCP
          port: 15010
    ## Allow all TCP egress (PostgreSQL, Keycloak, MinIO, ODK, etc.)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 80
    ## Allow egress to any pod in the namespace (ODK Central, etc.)
    - to:
        - podSelector: {}
{{- end }}
